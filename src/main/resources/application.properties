spring.application.name=adventure-book

spring.datasource.url=jdbc:postgresql://localhost:5432/adventure_book
spring.datasource.username=adventure
spring.datasource.password=adventure

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# load lazy collections (e.g. categories of a page of books) in batches instead of one query per book
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.mvc.problemdetails.enabled=true
